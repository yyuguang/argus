version: '3.8'

services:
  # ==================== MySQL ====================
  argus-mysql:
    image: mysql:8.0
    container_name: argus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: argus123
      MYSQL_DATABASE: argus
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - argus-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis Stack（向量检索 + JSON + 全文搜索） ====================
  argus-redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: argus-redis
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight 管理界面
    volumes:
      - argus-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  argus-mysql-data:
  argus-redis-data:
