server:
  port: 8900

spring:
  application:
    name: argus-server

  # ==================== 数据源 ====================
  datasource:
    url: jdbc:mysql://localhost:3306/argus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: argus123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== Redis ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

  # ==================== Spring AI（DeepSeek V4） ====================
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.1
          max-tokens: 8192

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lnzz.argus.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Actuator & Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: argus-server

# ==================== Argus 配置 ====================
argus:
  # 内部 API 鉴权
  internal:
    token: ${ARGUS_INTERNAL_TOKEN:argus-internal-token-change-me}

  # SCM 平台配置
  scm:
    gitlab:
      enabled: true
      api-base-url: ${GITLAB_API_BASE_URL:https://gitlab.com/api/v4}
      web-base-url: ${GITLAB_WEB_BASE_URL:https://gitlab.com}
      api-timeout: 10000
      max-file-size: 1048576
      retry:
        max-attempts: 3
        backoff-multiplier: 2
    github:
      enabled: true
      api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      web-base-url: ${GITHUB_WEB_BASE_URL:https://github.com}
      api-timeout: 10000
      max-file-size: 1048576
      retry:
        max-attempts: 3
        backoff-multiplier: 2
    gitee:
      enabled: true
      api-base-url: ${GITEE_API_BASE_URL:https://gitee.com/api/v5}
      web-base-url: ${GITEE_WEB_BASE_URL:https://gitee.com}
      api-timeout: 10000
      max-file-size: 1048576
      retry:
        max-attempts: 3
        backoff-multiplier: 2

  # ==================== 向量知识库配置 ====================
  vector:
    # 默认关闭向量检索，避免本地未配置 embedding 服务时 RedisVectorStore 初始化触发 AI 404。
    # 需要向量知识库时，先确认 Redis Stack 与 embedding 模型可用，再设置 ARGUS_VECTOR_ENABLED=true。
    enabled: ${ARGUS_VECTOR_ENABLED:false}
    error-search-topk: 5
    knowledge-min-score: 0.7

  # 评审配置
  review:
    # 评分阈值，低于此分数阻止合并
    block-threshold: 60
    # 评审维度权重
    dimensions:
      compliance: 30
      correctness: 25
      data-integrity: 20
      performance: 15
      maintainability: 10
    # 扣分规则
    scoring:
      critical-deduction: 15
      major-deduction: 8
      minor-deduction: 3

  # dataway 日志监控
  response-monitor:
    dataway:
      datasource-url: ${DATAWAY_DB_URL:jdbc:mysql://localhost:3306/dataway}
      datasource-username: ${DATAWAY_DB_USER:root}
      datasource-password: ${DATAWAY_DB_PASS:argus123}
      table-name: gaea_api_history
      poll-interval: 10000
      batch-size: 200

  # ==================== M7: 通知配置 ====================
  notification:
    enabled: true
    default-channel: wechat
    wechat:
      webhooks:
        default: ${WECHAT_WEBHOOK_DEFAULT:}
        critical: ${WECHAT_WEBHOOK_DEFAULT:}
      rate-limit:
        same-type-interval: 60
        max-per-hour: 30

    feishu:
      enabled: false
      webhooks:
        default: ${FEISHU_WEBHOOK_DEFAULT:}

    dingtalk:
      enabled: false
      webhooks:
        default: ${DINGTALK_WEBHOOK_DEFAULT:}

    # M7-A01: 路由规则（按顺序匹配，命中即停）
    route-rules:
      - severity: P0
        channel: critical
        priority: urgent
      - severity: P1
        channel: critical
        priority: urgent
      - severity: P2
        channel: default
        priority: normal
      - severity: P3
        channel: default
        priority: suppress

    # M7-A05: 静默控制
    silence:
      always-notify-p0p1: true
      fingerprint-interval: 300
      p3-interval: 3600
      global-max-per-hour: 30

    # M7-A05: 重试配置
    retry:
      max-retries: 3
      backoff-seconds:
        - 30
        - 120
        - 300
      timeout: 600

# ==================== 日志配置 ====================
logging:
  level:
    com.lnzz.argus: debug
    org.springframework.ai: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
