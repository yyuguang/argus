server:
  port: 8900

spring:
  application:
    name: argus-server

  # ==================== 数据源 ====================
  datasource:
    url: jdbc:mysql://localhost:3306/argus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: argus123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== Redis ====================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

  # ==================== Spring AI（DeepSeek V4） ====================
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.1
          max-tokens: 8192

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lnzz.argus.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Actuator & Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: argus-server

# ==================== Argus 配置 ====================
argus:
  # 内部 API 鉴权
  internal:
    token: ${ARGUS_INTERNAL_TOKEN:argustest}

  # SCM 平台配置
  scm:
    gitlab:
      enabled: true
      api-base-url: ${GITLAB_API_BASE_URL:https://gitlab.com/api/v4}
      web-base-url: ${GITLAB_WEB_BASE_URL:https://gitlab.com}
      api-timeout: 10000
      max-file-size: 1048576
      retry:
        max-attempts: 3
        backoff-multiplier: 2
    github:
      enabled: true
      api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
      web-base-url: ${GITHUB_WEB_BASE_URL:https://github.com}
      api-timeout: 10000
      max-file-size: 1048576
      retry:
        max-attempts: 3
        backoff-multiplier: 2
    gitee:
      enabled: true
      api-base-url: ${GITEE_API_BASE_URL:https://gitee.com/api/v5}
      web-base-url: ${GITEE_WEB_BASE_URL:https://gitee.com}
      api-timeout: 10000
      max-file-size: 1048576
      retry:
        max-attempts: 3
        backoff-multiplier: 2

  # ==================== 向量知识库配置 ====================
  vector:
    # 默认关闭向量检索，避免本地未配置 embedding 服务时 RedisVectorStore 初始化触发 AI 404。
    # 需要向量知识库时，先确认 Redis Stack 与 embedding 模型可用，再设置 ARGUS_VECTOR_ENABLED=true。
    enabled: ${ARGUS_VECTOR_ENABLED:false}
    error-search-topk: 5
    knowledge-min-score: 0.7

  # 评审配置
  review:
    # 评分阈值，低于此分数阻止合并
    block-threshold: 60
    # 评审维度权重
    dimensions:
      compliance: 30
      correctness: 25
      data-integrity: 20
      performance: 15
      maintainability: 10
    # 扣分规则
    scoring:
      critical-deduction: 15
      major-deduction: 8
      minor-deduction: 3

  # ==================== Phase 2: 错误处理策略 ====================
  error:
    dedup:
      # 同 app + environment + fingerprint 的聚合窗口（秒）
      window-seconds: ${ARGUS_ERROR_DEDUP_WINDOW_SECONDS:60}
      # 预留：重复达到阈值后升级分析/通知
      repeat-upgrade-threshold: ${ARGUS_ERROR_REPEAT_UPGRADE_THRESHOLD:10}
    analysis:
      # P2 已知指纹默认进入条件分析
      analyze-p2: ${ARGUS_ERROR_ANALYZE_P2:true}
      # P3 默认只聚合，不进入 AI
      analyze-p3: ${ARGUS_ERROR_ANALYZE_P3:false}
      # 业务异常默认保留条件分析能力
      analyze-biz-exception: ${ARGUS_ERROR_ANALYZE_BIZ_EXCEPTION:true}
      # 已确认知识/白名单精确命中时跳过 AI
      skip-known-knowledge: ${ARGUS_ERROR_SKIP_KNOWN_KNOWLEDGE:true}
    source:
      # SCM 单文件源码缓存 TTL（秒），只缓存短期 Prompt 输入，不写数据库
      cache-ttl-seconds: ${ARGUS_ERROR_SOURCE_CACHE_TTL_SECONDS:900}
      # 单文件最大字符数
      max-file-chars: ${ARGUS_ERROR_SOURCE_MAX_FILE_CHARS:20000}
      # 关联上下文文件最大数量
      max-related-files: ${ARGUS_ERROR_SOURCE_MAX_RELATED_FILES:3}
      # 单次错误分析 Prompt 源码总字符预算
      max-prompt-source-chars: ${ARGUS_ERROR_SOURCE_MAX_PROMPT_CHARS:30000}
    summary:
      hourly-cron: ${ARGUS_ERROR_SUMMARY_HOURLY_CRON:0 0 * * * *}
      daily-cron: ${ARGUS_ERROR_SUMMARY_DAILY_CRON:0 10 0 * * *}
      weekly-cron: ${ARGUS_ERROR_SUMMARY_WEEKLY_CRON:0 30 0 * * MON}
    severity-policy:
      # 错误类型默认等级矩阵。Nginx 502/503/504 默认 P1，BizException 默认 P3。
      default-levels:
        SQL_EXCEPTION: P1
        CONNECTION_REFUSED: P1
        NGINX_502: P1
        NGINX_503: P1
        NGINX_504: P1
        NGINX_499: P2
        NGINX_5XX: P1
        NGINX_4XX: P3
        TIMEOUT: P2
        NULL_POINTER: P2
        CLASS_CAST: P2
        INDEX_OUT_OF_BOUNDS: P2
        IO_EXCEPTION: P2
        HTTP_ERROR: P2
        MQ_ERROR: P2
        SERIALIZATION_ERROR: P2
        BIZ_EXCEPTION: P3
        UNKNOWN: P2
      environment-upgrade:
        enabled: true
        environments:
          - PROD
          - PRODUCTION
        error-types:
          - SQL_EXCEPTION
          - CONNECTION_REFUSED
          - TIMEOUT
        from: P2
        to: P1
      frequency-upgrade:
        enabled: true
        threshold: ${ARGUS_ERROR_SEVERITY_FREQ_THRESHOLD:10}
        to: P2
        high-threshold: ${ARGUS_ERROR_SEVERITY_FREQ_HIGH_THRESHOLD:50}
        high-to: P1
      core-link-upgrade:
        enabled: true
        interface-refs: []
        request-uris: []
        owner-teams: []
        app-names: []
        to: P1
      data-consistency-upgrade:
        enabled: true
        keywords:
          - amount
          - balance
          - stock
          - inventory
          - payment
          - settlement
          - 金额
          - 余额
          - 库存
          - 支付
          - 结算
        to: P1
      knowledge-downgrade:
        enabled: true
        whitelist-statuses:
          - WHITELIST
        low-risk-statuses:
          - KNOWN_LOW_RISK
          - LOW_RISK
        whitelist-to: P3
        low-risk-to: P3
      ai-calibration:
        protect-high-severity-downgrade: true

  # ==================== M7: 通知配置 ====================
  notification:
    enabled: true
    wechat:
      rate-limit:
        same-type-interval: 60
        max-per-hour: 30

    feishu:
      enabled: false
      webhooks:
        default: ${FEISHU_WEBHOOK_DEFAULT:}

    dingtalk:
      enabled: false
      webhooks:
        default: ${DINGTALK_WEBHOOK_DEFAULT:}

    # M7-A05: 静默控制
    silence:
      always-notify-p0p1: true
      fingerprint-interval: 300
      p3-interval: 3600
      global-max-per-hour: 30

# ==================== 日志配置 ====================
logging:
  level:
    com.lnzz.argus: debug
    org.springframework.ai: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n%ex{full}"
